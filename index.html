  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --pink:#2563eb;--hot:#3b82f6;--orange:#f97316;
      --gold:#10b981;--yellow:#34d399;
      --bg:#0a0f1e;--white:#f8fafc;
      --text:#f8fafc;--muted:#94a3b8;
      --border:rgba(37,99,235,0.25);
    }
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;border:4px solid transparent;border-image:linear-gradient(var(--angle,0deg),#2563eb,#10b981,#f97316,#3b82f6,#10b981,#2563eb) 1;}
    
    
    .particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .particle{position:absolute;width:4px;height:4px;border-radius:50%;animation:particleFloat linear infinite;opacity:0;}
    @keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:.6;}90%{opacity:.2;}100%{transform:translateY(-20px) scale(1.5);opacity:0;}}
    .mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,rgba(37,99,235,.15) 0%,transparent 45%),radial-gradient(ellipse at 100% 0%,rgba(16,185,129,.1) 0%,transparent 45%),radial-gradient(ellipse at 50% 100%,rgba(249,115,22,.08) 0%,transparent 45%);}
    

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:.85rem;padding:.7rem 1.5rem;margin:6px;border-radius:16px;background:rgba(10,15,30,.93);backdrop-filter:blur(20px);border:2px solid transparent;background-clip:padding-box;box-shadow:0 4px 30px rgba(37,99,235,.15);}
    nav::before{content:'';position:absolute;inset:-2px;border-radius:18px;z-index:-1;background:#e5e7eb;}
    
    .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0;}
    .nav-logo-img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(37,99,235,.4));}
    
    .nav-brand{display:flex;align-items:center;flex-shrink:0;}
    .nav-brand-part{font-family:'Syne',sans-serif;font-size:1rem;line-height:1;color:#f8fafc;white-space:nowrap;font-weight:800;}
    .nav-search{flex:1;max-width:320px;position:relative;min-width:0;}
    .nav-search-input{width:100%;padding:.52rem 2rem .52rem 2.1rem;background:rgba(255,255,255,.1);border:2px solid rgba(16,185,129,.5);border-radius:99px;color:#f8fafc;font-size:.78rem;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .25s;}
    .nav-search-input:focus{outline:none;border-color:var(--hot);background:rgba(37,99,235,.14);box-shadow:0 0 0 4px rgba(37,99,235,.12);}
    .nav-search-input::placeholder{color:#94a3b8;}
    .nav-search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.78rem;pointer-events:none;color:#10b981;}
    .nav-search-clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--hot);border:none;color:#fff;font-size:.55rem;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;}
    .nav-search-clear.show{display:flex;}
    .nav-socials{display:flex;gap:.38rem;flex-shrink:0;margin-left:auto;}
    .nav-social{width:30px;height:30px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:transform .2s;flex-shrink:0;}
    .nav-social:hover{transform:translateY(-2px) scale(1.1);}
    .nav-social.fb{background:linear-gradient(135deg,#1877f2,#0a5bc4);}
    .nav-social.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
    .nav-social.yt{background:linear-gradient(135deg,#ff0000,#cc0000);}
    .nav-social.tt{background:linear-gradient(135deg,#010101,#2d2d2d);}
    /* HAMBURGER */
    .hamburger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:rgba(37,99,235,.1);border:1.5px solid rgba(37,99,235,.3);border-radius:10px;cursor:pointer;padding:8px;transition:all .2s;flex-shrink:0;}

    .hamburger span{display:block;height:2px;background:#3b82f6;border-radius:2px;transition:all .3s;}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    .nav-menu{position:absolute;top:calc(100% + 10px);left:0;background:rgba(10,15,30,.97);backdrop-filter:blur(20px);border-radius:16px;border:2px solid rgba(37,99,235,.25);box-shadow:0 12px 40px rgba(37,99,235,.2);padding:.75rem;min-width:180px;z-index:999;opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:all .22s cubic-bezier(.16,1,.3,1);}

    .nav-menu a{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-radius:10px;text-decoration:none;color:var(--text);font-size:.88rem;font-weight:600;transition:all .18s;}

/* SEARCH */
function onSearch(val){
  searchQuery=val.trim();
  document.getElementById('searchClear').classList.toggle('show',searchQuery.length>0);
  render();
  if(searchQuery)document.getElementById('products').scrollIntoView({behavior:'smooth'});
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  searchQuery='';render();
}
function hl(text,q){
  if(!q)return esc(text);
  const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp(`(${safe})`,'gi'),'<mark class="highlight">$1</mark>');
}

/* SHARE / UTILS */
function makeSlug(t){return(t||'product').toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,10);}
function toggleShare(e,pid){
  e.stopPropagation();
  document.querySelectorAll('.share-popup.open').forEach(el=>{if(el.dataset.pid!==pid)el.classList.remove('open');});
  const popup=document.querySelector(`.share-popup[data-pid="${pid}"]`);
  if(popup)popup.classList.toggle('open');
}
document.addEventListener('click',()=>{document.querySelectorAll('.share-popup.open').forEach(el=>el.classList.remove('open'));});
function copyLink(url){
  navigator.clipboard.writeText(url).then(showToast).catch(()=>{
    const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast();
  });
}
function showToast(){
  const t=document.getElementById('copyToast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}
function selectCardVariant(pid,idx){
  const p=allProducts.find(x=>x.id===pid);if(!p)return;
  const v=p.variants[idx];
  document.querySelectorAll(`.card-variant-btn[data-pid="${pid}"]`).forEach((b,i)=>b.classList.toggle('active',i===idx));
  const priceEl=document.getElementById(`card-price-${pid}`);
  if(priceEl)priceEl.textContent=v.price;
  const buyBtn=document.getElementById(`buy-btn-${pid}`);
  if(buyBtn){
    buyBtn.classList.remove('disabled');
    buyBtn.removeAttribute('disabled');
    // Link to checkout-page with affiliate link
    buyBtn.href=`checkout-page.html?link=${encodeURIComponent(v.checkoutLink)}`;
  }
  const hint=document.getElementById(`select-hint-${pid}`);
  if(hint)hint.style.display='none';
}
function goToProduct(pid){window.location.href=`product.html?id=${pid}`;}

/* RENDER — show only 6 random products */
function render(){
  const grid=document.getElementById('productsGrid');
  const label=document.getElementById('searchLabel');
  const q=searchQuery.toLowerCase();
  let list=allProducts;

  if(searchQuery){
    list=allProducts.filter(p=>(p.title||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q));
    label.className='search-label show';
    label.innerHTML=list.length
      ?`${list.length} result${list.length!==1?'s':''} for "<span>${esc(searchQuery)}</span>"`
      :`Walang nahanap para sa "<span>${esc(searchQuery)}</span>"`;
  }else{
    label.className='search-label';
    // Pick 6 random products
    const shuffled=[...list].sort(()=>Math.random()-.5);
    list=shuffled.slice(0,6);
  }

  if(!allProducts.length){
    grid.innerHTML=`<div class="empty-search"><div class="ei">💖</div><p>No products yet. Check back soon!</p></div>`;
    return;
  }
  if(searchQuery&&!list.length){
    grid.innerHTML=`<div class="empty-search"><div class="ei">🔍</div><p>Walang nahanap.<br>Subukan ang ibang keyword.</p></div>`;
    return;
  }

  grid.innerHTML=`<div class="products-grid">`+list.map((p,i)=>{
    const productPageUrl=`${SITE_URL}/product.html?id=${p.id}`;
    const fbShare=`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(productPageUrl)}`;
    const variants=p.variants||[];
    const firstPrice=variants.length?variants[0].price:'';
    const firstCheckout=variants.length&&variants[0].checkoutLink?`checkout-page.html?link=${encodeURIComponent(variants[0].checkoutLink)}`:'#';

    const variantBtns=variants.map((v,vi)=>`
      <button class="card-variant-btn${vi===0?' active':''}" data-pid="${p.id}" onclick="event.stopPropagation();selectCardVariant('${p.id}',${vi})">${esc(v.name)} — ${esc(v.price)}</button>
    `).join('');

    const buyEnabled=variants.length>0;

    return `
    <div class="prod-card" >
      <div class="ribbon">⭐ Best Seller</div>
      <div class="card-img-link" onclick="goToProduct('${p.id}')">
        ${p.imageUrl
          ?`<img class="card-img" src="${esc(p.imageUrl.replace(/^\//,''))}" loading="lazy" decoding="async" alt="${esc(p.title||'')}" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder onclick=goToProduct(&quot;${p.id}&quot;)><span>✨</span></div>'">`
          :`<div class="card-img-placeholder"><span>✨</span></div>`}
      </div>
      <div class="card-body">
        <div class="card-text-link" onclick="goToProduct('${p.id}')">
          <div class="card-title">${hl(p.title||'',searchQuery)}</div>
          <div class="card-desc">${hl(p.description||'',searchQuery)}</div>
        </div>
        ${variants.length?`
          <div class="card-variants-label">Choose Package</div>
          <div class="card-variants-row">${variantBtns}</div>
        `:''}
        <div class="card-footer">
          <div class="card-price-display" id="card-price-${p.id}">${esc(firstPrice)}</div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <div style="position:relative;">
              <button class="share-btn" onclick="toggleShare(event,'${p.id}')" title="Share">🔗</button>
              <div class="share-popup" data-pid="${p.id}" onclick="event.stopPropagation()">
                <div class="share-popup-title">Share this product</div>
                <div class="share-link-display">
                  <span class="share-link-text">${SITE_URL}/product.html?id=${p.id}</span>
                  <button class="copy-btn" onclick="copyLink('${productPageUrl}')">Copy</button>
                </div>
                <div class="share-socials">
                  <a class="share-social fb" href="${fbShare}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
                  <a class="share-social ig" href="https://instagram.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/></svg></a>
                  <a class="share-social yt" href="https://youtube.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="white"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58a2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#ff0000"/></svg></a>
                  <a class="share-social tt" href="https://tiktok.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34l-.04-8.33a8.27 8.27 0 0 0 4.84 1.55V4.98a4.85 4.85 0 0 1-1.03-.29z"/></svg></a>
                </div>
              </div>
            </div>
            <a id="buy-btn-${p.id}" class="buy-btn${buyEnabled?'':' disabled'}" href="${firstCheckout}" onclick="if(this.classList.contains('disabled')){event.preventDefault();return;}">🛒 Buy Now</a>
          </div>
        </div>
      </div>
    </div>`;
  }).join('')+`</div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
loadProducts();
</script>

<script>
/* Global lazy-load observer for all static <img> tags */
(function(){
  if(!('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        const img = e.target;
        if(img.dataset.src){ img.src = img.dataset.src; delete img.dataset.src; }
        img.setAttribute('loading','lazy');
        img.setAttribute('decoding','async');
        obs.unobserve(img);
      }
    });
  },{rootMargin:'300px 0px'});
  document.querySelectorAll('img:not([data-lazy-skip])').forEach(img => obs.observe(img));
})();
</script>
