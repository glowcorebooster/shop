  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --pink:#2563eb;--hot:#3b82f6;--orange:#f97316;
      --gold:#10b981;--yellow:#34d399;
      --bg:#0a0f1e;--white:#f8fafc;
      --text:#f8fafc;--muted:#94a3b8;
      --border:rgba(37,99,235,0.25);
    }
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;border:4px solid transparent;border-image:linear-gradient(var(--angle,0deg),#2563eb,#10b981,#f97316,#3b82f6,#10b981,#2563eb) 1;}
    
    
    .particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .particle{position:absolute;width:4px;height:4px;border-radius:50%;animation:particleFloat linear infinite;opacity:0;}
    @keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:.6;}90%{opacity:.2;}100%{transform:translateY(-20px) scale(1.5);opacity:0;}}
    .mesh-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,rgba(37,99,235,.15) 0%,transparent 45%),radial-gradient(ellipse at 100% 0%,rgba(16,185,129,.1) 0%,transparent 45%),radial-gradient(ellipse at 50% 100%,rgba(249,115,22,.08) 0%,transparent 45%);}
    

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:.85rem;padding:.7rem 1.5rem;margin:6px;border-radius:16px;background:rgba(10,15,30,.93);backdrop-filter:blur(20px);border:2px solid transparent;background-clip:padding-box;box-shadow:0 4px 30px rgba(37,99,235,.15);}
    nav::before{content:'';position:absolute;inset:-2px;border-radius:18px;z-index:-1;background:#e5e7eb;}
    
    .nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0;}
    .nav-logo-img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(37,99,235,.4));}
    
    .nav-brand{display:flex;align-items:center;flex-shrink:0;}
    .nav-brand-part{font-family:'Syne',sans-serif;font-size:1rem;line-height:1;color:#f8fafc;white-space:nowrap;font-weight:800;}
    .nav-search{flex:1;max-width:320px;position:relative;min-width:0;}
    .nav-search-input{width:100%;padding:.52rem 2rem .52rem 2.1rem;background:rgba(255,255,255,.1);border:2px solid rgba(16,185,129,.5);border-radius:99px;color:#f8fafc;font-size:.78rem;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .25s;}
    .nav-search-input:focus{outline:none;border-color:var(--hot);background:rgba(37,99,235,.14);box-shadow:0 0 0 4px rgba(37,99,235,.12);}
    .nav-search-input::placeholder{color:#94a3b8;}
    .nav-search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.78rem;pointer-events:none;color:#10b981;}
    .nav-search-clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--hot);border:none;color:#fff;font-size:.55rem;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;}
    .nav-search-clear.show{display:flex;}
    .nav-socials{display:flex;gap:.38rem;flex-shrink:0;margin-left:auto;}
    .nav-social{width:30px;height:30px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:transform .2s;flex-shrink:0;}
    .nav-social:hover{transform:translateY(-2px) scale(1.1);}
    .nav-social.fb{background:linear-gradient(135deg,#1877f2,#0a5bc4);}
    .nav-social.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
    .nav-social.yt{background:linear-gradient(135deg,#ff0000,#cc0000);}
    .nav-social.tt{background:linear-gradient(135deg,#010101,#2d2d2d);}
    /* HAMBURGER */
    .hamburger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:rgba(37,99,235,.1);border:1.5px solid rgba(37,99,235,.3);border-radius:10px;cursor:pointer;padding:8px;transition:all .2s;flex-shrink:0;}
    .hamburger:hover{background:rgba(37,99,235,.2);border-color:#3b82f6;}
    .hamburger span{display:block;height:2px;background:#3b82f6;border-radius:2px;transition:all .3s;}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    .nav-menu{position:absolute;top:calc(100% + 10px);left:0;background:rgba(10,15,30,.97);backdrop-filter:blur(20px);border-radius:16px;border:2px solid rgba(37,99,235,.25);box-shadow:0 12px 40px rgba(37,99,235,.2);padding:.75rem;min-width:180px;z-index:999;opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:all .22s cubic-bezier(.16,1,.3,1);}
    .nav-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
    .nav-menu a{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-radius:10px;text-decoration:none;color:var(--text);font-size:.88rem;font-weight:600;transition:all .18s;}
    .nav-menu a:hover{background:rgba(37,99,235,.12);color:#3b82f6;}
    .nav-menu a .menu-icon{font-size:1rem;width:22px;text-align:center;}
    @media(max-width:700px){nav{padding:.6rem 1rem;margin:4px;gap:.5rem;}.nav-brand-part:last-child{display:none;}.nav-search{max-width:160px;}.nav-socials{display:none;}}
    @media(max-width:400px){.nav-search{max-width:120px;}}

    /* ── CAROUSEL ── */
    .carousel-section{padding:1.5rem 0 0;position:relative;z-index:1;}
    .carousel-wrap{position:relative;overflow:hidden;border-radius:0;max-height:480px;}
    .carousel-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1);}
    .carousel-slide{min-width:100%;position:relative;overflow:hidden;cursor:pointer;}
    .carousel-slide img{width:100%;height:480px;object-fit:cover;display:block;}
    .carousel-slide-placeholder{width:100%;height:480px;display:flex;align-items:center;justify-content:center;font-size:5rem;}
    .carousel-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 55%);display:flex;align-items:flex-end;padding:2.5rem;}
    .carousel-caption{color:#fff;}
    .carousel-caption h2{font-family:'Lilita One',cursive;font-size:clamp(1.5rem,4vw,2.4rem);text-shadow:0 2px 12px rgba(0,0,0,.4);margin-bottom:.4rem;}
    .carousel-caption p{font-size:.88rem;opacity:.9;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.3);}
    .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:all .2s;z-index:5;}
    .carousel-btn:hover{background:#fff;transform:translateY(-50%) scale(1.08);}
    .carousel-btn.prev{left:14px;}
    .carousel-btn.next{right:14px;}
    .carousel-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;}
    .carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);border:none;cursor:pointer;transition:all .25s;padding:0;}
    .carousel-dot.active{background:#fff;width:22px;border-radius:4px;}

    /* HERO */
    .hero{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem 3rem;position:relative;z-index:1;}
    .hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(16,185,129,.12));border:2px solid rgba(37,99,235,.3);border-radius:99px;padding:.45rem 1.2rem;font-size:.7rem;font-weight:700;color:#3b82f6;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.2rem;}
    
    .hero-logo{width:110px;height:110px;object-fit:contain;margin-bottom:1.2rem;filter:drop-shadow(0 12px 32px rgba(37,99,235,.4));}
    
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin-bottom:.8rem;color:#f8fafc;}
    
    .hero-sub{font-size:.95rem;color:#cbd5e1;max-width:460px;line-height:1.8;margin-bottom:2rem;font-weight:500;}
    .hero-cta-row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
    .hero-cta{display:inline-flex;align-items:center;gap:.6rem;background:linear-gradient(135deg,#f97316,#ef4444,#f97316);background-size:200%;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;padding:.85rem 2.2rem;border-radius:99px;border:none;cursor:pointer;text-decoration:none;box-shadow:0 8px 28px rgba(249,115,22,.4);}
    
    .hero-cta:hover{transform:scale(1.06);animation:none;}
    .hero-cta.outline{background:transparent;background-image:none;color:#10b981;border:2.5px solid #10b981;box-shadow:none;animation:none;}
    .hero-cta.outline:hover{background:rgba(16,185,129,.1);}

    /* BENEFITS */
    .benefits{display:flex;align-items:stretch;justify-content:center;gap:1rem;flex-wrap:wrap;padding:0 2rem 3rem;position:relative;z-index:1;max-width:900px;margin:0 auto;}
    .benefit-card{flex:1;min-width:140px;max-width:190px;background:#141d33;border-radius:18px;padding:1.2rem 1rem;text-align:center;border:2px solid transparent;position:relative;overflow:hidden;transition:transform .25s;}
    .benefit-card::before{content:'';position:absolute;inset:0;border-radius:18px;z-index:-1;background:linear-gradient(135deg,#2563eb,#10b981,#f97316);margin:-2px;}
    .benefit-card:hover{transform:translateY(-6px);}
    .benefit-icon{font-size:1.8rem;margin-bottom:.4rem;display:block;}
    .benefit-title{font-family:'Syne',sans-serif;font-weight:800;font-size:.85rem;color:var(--text);}
    .benefit-sub{font-size:.68rem;color:var(--muted);font-weight:500;}

    /* STORE */
    .store-section{padding:2rem 1.5rem 6rem;max-width:1200px;margin:0 auto;position:relative;z-index:1;}
    .section-head{text-align:center;margin-bottom:2rem;}
    .section-head h2{font-family:'Syne',sans-serif;font-size:2rem;background:linear-gradient(135deg,#3b82f6,#10b981,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem;font-weight:800;}
    .section-head p{font-size:.82rem;color:var(--muted);font-weight:500;}
    .shop-all-wrap{text-align:center;margin-top:2.5rem;}
    .shop-all-btn{display:inline-flex;align-items:center;gap:.5rem;background:transparent;border:2.5px solid #10b981;border-radius:99px;padding:.75rem 2rem;font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:#10b981;text-decoration:none;transition:all .2s;}
    .shop-all-btn:hover{background:#10b981;color:#0a0f1e;}

    /* LOADING */
    .loading-wrap{text-align:center;padding:4rem 2rem;}
    .loading-dots{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem;}
    .loading-dots span{width:12px;height:12px;border-radius:50%;animation:bounceDot 1.2s infinite ease-in-out;}
    .loading-dots span:nth-child(1){background:#3b82f6;animation-delay:0s;}
    .loading-dots span:nth-child(2){background:#10b981;animation-delay:.15s;}
    .loading-dots span:nth-child(3){background:#f97316;animation-delay:.3s;}
    @keyframes bounceDot{0%,100%{transform:translateY(0) scale(.8);opacity:.4;}50%{transform:translateY(-12px) scale(1.1);opacity:1;}}
    .loading-wrap p{font-size:.85rem;color:var(--muted);}

    /* GRID */
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.8rem;}

    /* PRODUCT CARD */
    .prod-card{background:#141d33;border-radius:22px;overflow:visible;position:relative;border:3px solid transparent;background-clip:padding-box;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;}
    .prod-card::after{content:'';position:absolute;inset:-3px;border-radius:25px;z-index:-1;background:linear-gradient(135deg,#2563eb,#10b981,#f97316);}
    
    .prod-card:hover{transform:translateY(-8px) scale(1.01);box-shadow:0 24px 60px rgba(37,99,235,.2);}
    .ribbon{position:absolute;top:14px;left:-4px;z-index:3;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.28rem .75rem .28rem .55rem;border-radius:0 6px 6px 0;box-shadow:2px 3px 10px rgba(249,115,22,.4);}

    .card-img-link{display:block;overflow:hidden;border-radius:19px 19px 0 0;cursor:pointer;}
    .card-img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .4s ease;will-change:auto;}
    .prod-card:hover .card-img{transform:scale(1.05);}
    .card-img-placeholder{width:100%;height:220px;background:linear-gradient(135deg,#111827,#1a2540,#0f2027);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;cursor:pointer;}
    .card-img-placeholder span{font-size:3rem;}

    .card-body{padding:1.2rem;background:#141d33;border-radius:0 0 19px 19px;}
    .card-text-link{display:block;text-decoration:none;color:inherit;cursor:pointer;}
    .card-text-link:hover .card-title{color:#3b82f6;}
    .card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:#f8fafc;margin-bottom:.35rem;line-height:1.3;transition:color .2s;}
    .card-desc{font-size:.77rem;color:#94a3b8;line-height:1.65;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

    .card-variants-label{font-size:.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:.8rem 0 .4rem;}
    .card-variants-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem;}
    .card-variant-btn{font-size:.68rem;font-weight:700;padding:.3rem .7rem;border-radius:8px;background:rgba(37,99,235,.08);border:1.5px solid rgba(37,99,235,.2);color:#cbd5e1;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s;white-space:nowrap;}
    .card-variant-btn:hover{border-color:#3b82f6;color:#3b82f6;background:rgba(37,99,235,.12);}
    .card-variant-btn.active{background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(16,185,129,.1));border-color:#3b82f6;color:#3b82f6;box-shadow:0 2px 10px rgba(37,99,235,.2);}

    .card-footer{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;}
    .card-price-display{font-family:'Syne',sans-serif;font-size:1.4rem;color:#10b981;min-width:60px;font-weight:800;}
    .card-actions{display:flex;align-items:center;gap:.45rem;}

    /* SHARE */
    .share-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--border);background:rgba(37,99,235,.08);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
    .share-btn:hover{background:rgba(37,99,235,.15);border-color:#3b82f6;transform:scale(1.1);}
    .share-popup{position:absolute;bottom:calc(100% + 8px);right:0;z-index:200;background:#141d33;border-radius:16px;padding:1rem;box-shadow:0 12px 40px rgba(37,99,235,.25),0 4px 16px rgba(0,0,0,.2);border:2px solid rgba(37,99,235,.25);width:230px;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:all .22s cubic-bezier(.16,1,.3,1);}
    .share-popup.open{opacity:1;transform:none;pointer-events:auto;}
    .share-popup-title{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;}
    .share-link-display{display:flex;align-items:center;gap:.4rem;margin-bottom:.65rem;background:rgba(37,99,235,.08);border:1.5px solid var(--border);border-radius:10px;padding:.42rem .6rem;}
    .share-link-text{font-size:.67rem;color:#3b82f6;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .copy-btn{font-size:.62rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#10b981);color:#fff;border:none;border-radius:7px;padding:.25rem .6rem;cursor:pointer;flex-shrink:0;transition:transform .15s;}
    .copy-btn:hover{transform:scale(1.05);}
    .share-socials{display:flex;gap:.45rem;justify-content:center;}
    .share-social{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s;}
    .share-social:hover{transform:translateY(-2px) scale(1.1);}
    .share-social.fb{background:linear-gradient(135deg,#1877f2,#0a5bc4);}
    .share-social.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
    .share-social.yt{background:linear-gradient(135deg,#ff0000,#cc0000);}
    .share-social.tt{background:linear-gradient(135deg,#010101,#2d2d2d);}
    .share-social svg{width:18px;height:18px;fill:white;}

    /* BUY NOW */
    .buy-btn{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:.82rem;padding:.58rem 1.15rem;border-radius:10px;border:none;cursor:pointer;text-decoration:none;box-shadow:0 4px 16px rgba(249,115,22,.35);transition:transform .2s,box-shadow .2s,opacity .2s;white-space:nowrap;}
    .buy-btn:hover:not(.disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.5);animation:none;}
    .buy-btn.disabled{background:linear-gradient(135deg,#333,#444);animation:none;opacity:.55;cursor:not-allowed;box-shadow:none;}
    .select-hint{font-size:.62rem;color:var(--muted);font-weight:600;font-style:italic;margin-top:.3rem;text-align:right;}

    /* SEARCH LABEL */
    .search-label{text-align:center;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:1.2rem;display:none;}
    .search-label.show{display:block;}
    .search-label span{color:#3b82f6;font-weight:700;}
    .highlight{background:rgba(37,99,235,.18);color:#3b82f6;border-radius:3px;padding:0 2px;}
    .empty-search{text-align:center;padding:4rem 2rem;color:var(--muted);}
    .empty-search .ei{font-size:3rem;margin-bottom:.8rem;}
    .empty-search p{font-size:.9rem;font-weight:500;line-height:1.8;}

    /* FOOTER */
    footer{position:relative;z-index:1;text-align:center;padding:3rem 2rem;background:line
