<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — IncomeEdge™ Academy</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0f1e;color:#f8fafc;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    h1{font-size:5rem;font-weight:900;background:linear-gradient(135deg,#3b82f6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;}
    h2{font-size:1.3rem;font-weight:700;margin-bottom:1rem;color:#f8fafc;}
    p{color:#94a3b8;margin-bottom:2rem;font-size:.9rem;}
    a{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-weight:800;font-size:.9rem;padding:.75rem 2rem;border-radius:12px;text-decoration:none;transition:transform .2s;}
    a:hover{transform:scale(1.04);}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">🏠 Back to Home</a>
  </div>
  <script>
    // If path is /products/[id].html — redirect to product.html?id=
    const path = window.location.pathname;
    if(path.includes('/products/')) {
      const id = path.split('/products/')[1].replace('.html','');
      if(id) window.location.replace('/product.html?id=' + id);
    }
  </script>
</body>
</html>
